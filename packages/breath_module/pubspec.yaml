name: breath_module
description: Breathing session presentation layer for Mind app.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  just_audio: ^0.10.5
  mind_audio:
    path: ../mind_audio
  mind_l10n:
    path: ../mind_l10n
  mind_logger:
    path: ../mind_logger
  mind_ui:
    path: ../mind_ui
  shimmer: any
  uuid: any
